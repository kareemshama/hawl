<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3d2b"/>
      <stop offset="1" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#c9992e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- crescent: large circle minus offset circle -->
  <mask id="cut">
    <rect width="1024" height="1024" fill="#fff"/>
    <circle cx="600" cy="452" r="270" fill="#000"/>
  </mask>
  <circle cx="512" cy="480" r="300" fill="url(#au)" mask="url(#cut)"/>
  <!-- ring: the year completing -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#f3d27a" stroke-opacity="0.35" stroke-width="22" stroke-dasharray="2200 400" stroke-linecap="round" transform="rotate(-90 512 512)"/>
</svg>
